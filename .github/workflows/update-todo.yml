name: Update Overview Dashboard

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Projects tasks, papers, and keywords, then update README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const fs = require('fs');
            const username = context.repo.owner;
            const profileRepo = `${username}/${username}`.toLowerCase();

            // 1. 개인(user) + 소속 조직(organization)의 모든 Projects V2 보드에서 항목 가져오기
            const query = `
              query {
                viewer {
                  projectsV2(first: 10) {
                    nodes {
                      items(first: 100) {
                        nodes {
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                            }
                          }
                          content {
                            ... on Issue {
                              title
                              url
                              state
                              repository {
                                name
                                nameWithOwner
                              }
                            }
                            ... on DraftIssue {
                              title
                            }
                          }
                        }
                      }
                    }
                  }
                  organizations(first: 10) {
                    nodes {
                      projectsV2(first: 10) {
                        nodes {
                          items(first: 100) {
                            nodes {
                              fieldValueByName(name: "Status") {
                                ... on ProjectV2ItemFieldSingleSelectValue {
                                  name
                                }
                              }
                              content {
                                ... on Issue {
                                  title
                                  url
                                  state
                                  repository {
                                    name
                                    nameWithOwner
                                  }
                                }
                                ... on DraftIssue {
                                  title
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectRes = await github.graphql(query);
            const userProjects = projectRes.viewer?.projectsV2?.nodes || [];
            const orgProjects = (projectRes.viewer?.organizations?.nodes || [])
              .flatMap(org => org.projectsV2?.nodes || []);
            const allProjects = [...userProjects, ...orgProjects];

            const targetStatuses = ['in progress', 'todo', 'backlog'];
            const seenKeys = new Set();
            const filteredTodos = [];

            allProjects.forEach(proj => {
              const items = proj.items?.nodes || [];
              items.forEach(item => {
                const content = item.content;
                if (!content || !content.title) return;

                if (content.url) {
                  if (content.state !== 'OPEN') return;
                  if (content.repository?.nameWithOwner?.toLowerCase() === profileRepo) return;
                }

                const uniqueKey = content.url || `draft:${content.title}`;
                if (seenKeys.has(uniqueKey)) return;

                const statusName = (item.fieldValueByName?.name || '').toLowerCase().trim();
                if (targetStatuses.includes(statusName)) {
                  seenKeys.add(uniqueKey);
                  filteredTodos.push({
                    title: content.title,
                    url: content.url || '',
                    repoName: content.repository?.name || 'Draft',
                    status: statusName
                  });
                }
              });
            });

            const getPriority = (status) => {
              if (status === 'in progress') return 1;
              if (status === 'todo') return 2;
              return 3;
            };

            let todoList = '';
            if (filteredTodos.length === 0) {
              todoList = '- 현재 할 일이 없습니다 🎉';
            } else {
              const sorted = filteredTodos.sort((a, b) => getPriority(a.status) - getPriority(b.status));
              todoList = sorted.map(task => {
                let badge = '📦';
                if (task.status === 'in progress') badge = '🚧';
                else if (task.status === 'todo') badge = '📝';

                const linkText = task.url ? `[${task.title}](${task.url})` : task.title;
                return `- ${badge} **[${task.repoName}]** ${linkText}`;
              }).join('\n');
            }

            // 2. 프로필 저장소(birdf00t/birdf00t) 논문 목록 & 키워드 집계
            const { data: paperIssues } = await github.rest.issues.listForRepo({
              owner: username,
              repo: username,
              state: 'all',
              sort: 'updated',
              direction: 'desc',
              per_page: 100
            });

            const activePapers = paperIssues.filter(issue => {
              if (issue.pull_request) return false;
              const names = issue.labels.map(l => l.name.toLowerCase().trim());
              return !names.includes('backlog');
            });

            // 2-1. 본문에서 Keywords 추출 및 상위 10개 정렬
            const keywordCounts = {};
            activePapers.forEach(issue => {
              if (!issue.body) return;
              const match = issue.body.match(/\*\*Keywords\*\*\s*:\s*(.+)/i);
              if (match && match[1]) {
                match[1].split(',').forEach(raw => {
                  const kw = raw.trim();
                  if (kw) {
                    const key = kw.toLowerCase();
                    if (!keywordCounts[key]) keywordCounts[key] = { label: kw, count: 0 };
                    keywordCounts[key].count += 1;
                  }
                });
              }
            });

            const topKeywords = Object.values(keywordCounts)
              .sort((a, b) => b.count - a.count)
              .slice(0, 10)
              .map(item => `\`${item.label}\``);

            const keywordLine = topKeywords.length > 0
              ? `- 🏷️ ${topKeywords.join(', ')}`
              : `- 🏷️ 아직 등록된 키워드가 없습니다`;

            // 2-2. 완료 / 읽는 중 카운트 뱃지 및 목록 생성
            const isPaperDone = (issue) => {
              const names = issue.labels.map(l => l.name.toLowerCase().trim());
              return issue.state === 'closed' || names.includes('done');
            };

            const doneCount = activePapers.filter(isPaperDone).length;
            const readingCount = activePapers.length - doneCount;

            let paperList = '';
            if (activePapers.length === 0) {
              paperList = '- 아직 등록된 논문 기록이 없습니다 📚';
            } else {
              const sortedPapers = activePapers.sort((a, b) => {
                const aDone = isPaperDone(a);
                const bDone = isPaperDone(b);
                if (aDone === bDone) return 0;
                return aDone ? 1 : -1;
              });

              const summaryLine = '![Completed](https://shields.io' + doneCount + '%20papers-2ea44f?style=flat-square) ![Reading](https://shields.io' + readingCount + '%20papers-0969da?style=flat-square)\n';
              const itemsText = sortedPapers.slice(0, 15).map(issue => {
                const done = isPaperDone(issue);
                const badge = done ? '✅' : '📖';
                return `- ${badge} [${issue.title}](${issue.html_url})`;
              }).join('\n');

              paperList = `${summaryLine}\n${itemsText}`;
            }

            // 3. README.md 업데이트
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!-- START_KEYWORDS -->[\s\S]*<!-- END_KEYWORDS -->/,
              `<!-- START_KEYWORDS -->\n${keywordLine}\n<!-- END_KEYWORDS -->`
            );
            readme = readme.replace(
              /<!-- START_TODO_ISSUES -->[\s\S]*<!-- END_TODO_ISSUES -->/,
              `<!-- START_TODO_ISSUES -->\n${todoList}\n<!-- END_TODO_ISSUES -->`
            );
            readme = readme.replace(
              /<!-- START_PAPERS -->[\s\S]*<!-- END_PAPERS -->/,
              `<!-- START_PAPERS -->\n${paperList}\n<!-- END_PAPERS -->`
            );

            fs.writeFileSync('README.md', readme);

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update dashboard" && git push)
