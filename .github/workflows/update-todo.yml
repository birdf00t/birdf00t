name: Update Overview Dashboard

on:
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - labeled
      - unlabeled
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect raw issue and project fields
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const fs = require('fs');
            const username = context.repo.owner;
            const profileRepo = `${username}/${username}`.toLowerCase();

            // 1. birdf00t 계정의 모든 Open 이슈 검색
            const { data: searchRes } = await github.rest.search.issuesAndPullRequests({
              q: `author:${username} is:issue is:open`,
              sort: 'updated',
              order: 'desc',
              per_page: 20
            });

            const rawTodos = searchRes.items.filter(issue => {
              const repoFullName = issue.repository_url.split('/repos/').pop().toLowerCase();
              return repoFullName !== profileRepo;
            });

            let todoList = '';
            if (rawTodos.length === 0) {
              todoList = '- No open tasks 🎉';
            } else {
              const lines = [];
              for (const issue of rawTodos) {
                const repoName = issue.repository_url.split('/').pop();
                const labels = issue.labels.map(l => l.name).join(', ') || '없음';
                const milestone = issue.milestone?.title || '없음';
                const issueType = issue.type?.name || '없음';
                let projectRaw = '조회안됨';

                if (issue.node_id) {
                  try {
                    const nodeRes = await github.graphql(`
                      query($id: ID!) {
                        node(id: $id) {
                          ... on Issue {
                            projectItems(first: 5) {
                              nodes {
                                project {
                                  title
                                }
                                fieldValues(first: 20) {
                                  nodes {
                                    ... on ProjectV2ItemFieldSingleSelectValue {
                                      name
                                      field { ... on ProjectV2SingleSelectField { name } }
                                    }
                                    ... on ProjectV2ItemFieldTextValue {
                                      text
                                      field { ... on ProjectV2Field { name } }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    `, { id: issue.node_id });

                    const items = nodeRes.node?.projectItems?.nodes || [];
                    if (items.length === 0) {
                      projectRaw = '연결된 프로젝트 0개';
                    } else {
                      projectRaw = items.map(it => {
                        const pTitle = it.project?.title || '무제';
                        const vals = (it.fieldValues?.nodes || [])
                          .filter(f => f && (f.name || f.text))
                          .map(f => `${f.field?.name || '?'}=${f.name || f.text}`)
                          .join(' | ');
                        return `[${pTitle}: ${vals || '값없음'}]`;
                      }).join(' / ');
                    }
                  } catch (e) {
                    projectRaw = `에러(${e.message})`;
                  }
                }

                lines.push(`- 📌 **[${repoName}]** [${issue.title}](${issue.html_url})\n  - \`Labels: ${labels}\` / \`Milestone: ${milestone}\` / \`Type: ${issueType}\` / \`Projects: ${projectRaw}\``);
              }
              todoList = lines.join('\n');
            }

            // 2. 프로필 저장소(birdf00t/birdf00t) 논문 목록 & 키워드 집계
            const { data: paperIssues } = await github.rest.issues.listForRepo({
              owner: username,
              repo: username,
              state: 'all',
              sort: 'updated',
              direction: 'desc',
              per_page: 100
            });

            const activePapers = paperIssues.filter(issue => {
              if (issue.pull_request) return false;
              const names = issue.labels.map(l => l.name.toLowerCase().trim());
              return !names.includes('backlog');
            });

            const keywordCounts = {};
            activePapers.forEach(issue => {
              if (!issue.body) return;
              const match = issue.body.match(/\*\*Keywords\*\*\s*:\s*(.+)/i);
              if (match && match[1]) {
                match[1].split(',').forEach(raw => {
                  const kw = raw.trim();
                  if (kw) {
                    const key = kw.toLowerCase();
                    if (!keywordCounts[key]) keywordCounts[key] = { label: kw, count: 0 };
                    keywordCounts[key].count += 1;
                  }
                });
              }
            });

            const topKeywords = Object.values(keywordCounts)
              .sort((a, b) => b.count - a.count)
              .slice(0, 10)
              .map(item => `\`${item.label}\``);

            const keywordLine = topKeywords.length > 0
              ? `- 🏷️ ${topKeywords.join(', ')}`
              : `- 🏷️ No keywords yet`;

            const isPaperDone = (issue) => {
              const names = issue.labels.map(l => l.name.toLowerCase().trim());
              return issue.state === 'closed' || names.includes('done');
            };

            const doneCount = activePapers.filter(isPaperDone).length;

            let paperList = '';
            if (activePapers.length === 0) {
              paperList = '- No papers logged yet 📚';
            } else {
              const sortedPapers = activePapers.sort((a, b) => {
                const aDone = isPaperDone(a);
                const bDone = isPaperDone(b);
                if (aDone === bDone) return 0;
                return aDone ? 1 : -1;
              });

              const unit = doneCount === 1 ? 'paper' : 'papers';
              const summaryLine = '`Total Completed: ' + doneCount + ' ' + unit + '`\n';
              const itemsText = sortedPapers.slice(0, 15).map(issue => {
                const done = isPaperDone(issue);
                const badge = done ? '✅' : '📖';
                return `- ${badge} [${issue.title}](${issue.html_url})`;
              }).join('\n');

              paperList = `${summaryLine}\n${itemsText}`;
            }

            // 3. README.md 업데이트
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!-- START_KEYWORDS -->[\s\S]*<!-- END_KEYWORDS -->/,
              `<!-- START_KEYWORDS -->\n${keywordLine}\n<!-- END_KEYWORDS -->`
            );
            readme = readme.replace(
              /<!-- START_TODO_ISSUES -->[\s\S]*<!-- END_TODO_ISSUES -->/,
              `<!-- START_TODO_ISSUES -->\n${todoList}\n<!-- END_TODO_ISSUES -->`
            );
            readme = readme.replace(
              /<!-- START_PAPERS -->[\s\S]*<!-- END_PAPERS -->/,
              `<!-- START_PAPERS -->\n${paperList}\n<!-- END_PAPERS -->`
            );

            fs.writeFileSync('README.md', readme);

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: inspect raw fields" && git push)
