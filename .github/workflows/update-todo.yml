name: Update Open Issues To-Do

on:
  schedule:
    # 매시간 정각마다 자동 실행 (UTC 기준)
    - cron: '0 * * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동으로도 즉시 실행 가능

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch open issues and update README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const username = context.repo.owner;

            // in progress, todo, backlog 라벨이 붙은 Public Open 이슈만 검색
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `user:${username} is:issue is:open is:public label:"in progress",todo,backlog`,
              sort: 'updated',
              order: 'desc',
              per_page: 30
            });

            // review나 done 라벨이 함께 붙어 있는 경우 한 번 더 제외
            const filtered = data.items.filter(issue => {
              const names = issue.labels.map(l => l.name.toLowerCase());
              return !names.includes('review') && !names.includes('done');
            });

            // 정렬 순서: In Progress(1) -> To-Do(2) -> Backlog(3)
            const getPriority = (issue) => {
              const names = issue.labels.map(l => l.name.toLowerCase());
              if (names.includes('in progress')) return 1;
              if (names.includes('todo')) return 2;
              return 3;
            };

            let list = '';
            if (filtered.length === 0) {
              list = '- 현재 할 일이 없습니다 🎉';
            } else {
              const sorted = filtered.sort((a, b) => getPriority(a) - getPriority(b));

              list = sorted.map(issue => {
                const repoName = issue.repository_url.split('/').pop();
                const labelNames = issue.labels.map(l => l.name.toLowerCase());

                let statusBadge = '📦 `[Backlog]`';
                if (labelNames.includes('in progress')) {
                  statusBadge = '🚧 `[In Progress]`';
                } else if (labelNames.includes('todo')) {
                  statusBadge = '📝 `[To-Do]`';
                }

                return `- [ ] ${statusBadge} **[${repoName}]** [${issue.title}](${issue.html_url})`;
              }).join('\n');
            }

            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!-- START_TODO_ISSUES -->[\s\S]*<!-- END_TODO_ISSUES -->/,
              `<!-- START_TODO_ISSUES -->\n${list}\n<!-- END_TODO_ISSUES -->`
            );

            fs.writeFileSync('README.md', updated);

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update open issues todo" && git push)
