name: Update Overview Dashboard

on:
  # 1. 논문 이슈(birdf00t/birdf00t)가 생성, 수정, 닫힘, 다시 열림, 라벨 변경될 때마다 즉시 실행!
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  # 2. 다른 저장소의 할 일(Task) 동기화를 위한 1시간 주기 백업
  schedule:
    - cron: '0 * * * *'
  # 3. 수동 즉시 실행 버튼
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch tasks, papers, and keywords, then update README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const username = context.repo.owner;
            const profileRepo = `${username}/${username}`.toLowerCase();

            // 1. 일반 저장소 할 일(To-Do) 검색 (라벨이 없어도 Open 이슈면 모두 표시, Review/Done만 제외)
            const { data: openData } = await github.rest.search.issuesAndPullRequests({
              q: `user:${username} is:issue is:open is:public`,
              sort: 'updated',
              order: 'desc',
              per_page: 100
            });

            const filteredTodos = openData.items.filter(issue => {
              const repoFullName = issue.repository_url.split('/repos/').pop().toLowerCase();
              if (repoFullName === profileRepo) return false;

              const names = issue.labels.map(l => l.name.toLowerCase().trim());
              const hasExcluded = names.includes('review') || names.includes('done');
              return !hasExcluded;
            });

            const getPriority = (issue) => {
              const names = issue.labels.map(l => l.name.toLowerCase().trim());
              if (names.includes('in progress')) return 1;
              if (names.includes('todo')) return 2;
              if (names.includes('backlog')) return 3;
              return 4;
            };

            let todoList = '';
            if (filteredTodos.length === 0) {
              todoList = '- 현재 할 일이 없습니다 🎉';
            } else {
              const sorted = filteredTodos.sort((a, b) => getPriority(a) - getPriority(b));
              todoList = sorted.map(issue => {
                const repoName = issue.repository_url.split('/').pop();
                const labelNames = issue.labels.map(l => l.name.toLowerCase().trim());

                let statusBadge = '📌';
                if (labelNames.includes('in progress')) statusBadge = '🚧 `[In Progress]`';
                else if (labelNames.includes('todo')) statusBadge = '📝 `[To-Do]`';
                else if (labelNames.includes('backlog')) statusBadge = '📦 `[Backlog]`';

                return `- ${statusBadge} **[${repoName}]** [${issue.title}](${issue.html_url})`;
              }).join('\n');
            }

            // 2. 프로필 저장소(birdf00t/birdf00t) 논문 목록 & 키워드 집계
            const { data: paperIssues } = await github.rest.issues.listForRepo({
              owner: username,
              repo: username,
              state: 'all',
              sort: 'updated',
              direction: 'desc',
              per_page: 100
            });

            const activePapers = paperIssues.filter(issue => {
              if (issue.pull_request) return false;
              const names = issue.labels.map(l => l.name.toLowerCase().trim());
              return !names.includes('backlog');
            });

            // 2-1. 본문에서 Keywords 추출 및 상위 10개 정렬
            const keywordCounts = {};
            activePapers.forEach(issue => {
              if (!issue.body) return;
              const match = issue.body.match(/\*\*Keywords\*\*\s*:\s*(.+)/i);
              if (match && match[1]) {
                match[1].split(',').forEach(raw => {
                  const kw = raw.trim();
                  if (kw) {
                    const key = kw.toLowerCase();
                    if (!keywordCounts[key]) keywordCounts[key] = { label: kw, count: 0 };
                    keywordCounts[key].count += 1;
                  }
                });
              }
            });

            const topKeywords = Object.values(keywordCounts)
              .sort((a, b) => b.count - a.count)
              .slice(0, 10)
              .map(item => `\`${item.label}\``);

            const keywordLine = topKeywords.length > 0
              ? `- 🏷️ **Keywords**: ${topKeywords.join(', ')}`
              : `- 🏷️ **Keywords**: 아직 등록된 키워드가 없습니다`;

            // 2-2. 완료 / 읽는 중 카운트 및 목록 생성
            const isPaperDone = (issue) => {
              const names = issue.labels.map(l => l.name.toLowerCase().trim());
              return issue.state === 'closed' || names.includes('done');
            };

            const doneCount = activePapers.filter(isPaperDone).length;
            const readingCount = activePapers.length - doneCount;

            let paperList = '';
            if (activePapers.length === 0) {
              paperList = '- 아직 등록된 논문 기록이 없습니다 📚';
            } else {
              const sortedPapers = activePapers.sort((a, b) => {
                const aDone = isPaperDone(a);
                const bDone = isPaperDone(b);
                if (aDone === bDone) return 0;
                return aDone ? 1 : -1;
              });

              const summaryLine = `> 📊 **누적 완독: ${doneCount}편** · **현재 읽는 중: ${readingCount}편**\n`;
              const itemsText = sortedPapers.slice(0, 15).map(issue => {
                const done = isPaperDone(issue);
                const badge = done ? '✅ `[Done]`' : '📖 `[Reading]`';
                return `- ${badge} [${issue.title}](${issue.html_url})`;
              }).join('\n');

              paperList = `${summaryLine}\n${itemsText}`;
            }

            // 3. README.md 업데이트
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!-- START_KEYWORDS -->[\s\S]*<!-- END_KEYWORDS -->/,
              `<!-- START_KEYWORDS -->\n${keywordLine}\n<!-- END_KEYWORDS -->`
            );
            readme = readme.replace(
              /<!-- START_TODO_ISSUES -->[\s\S]*<!-- END_TODO_ISSUES -->/,
              `<!-- START_TODO_ISSUES -->\n${todoList}\n<!-- END_TODO_ISSUES -->`
            );
            readme = readme.replace(
              /<!-- START_PAPERS -->[\s\S]*<!-- END_PAPERS -->/,
              `<!-- START_PAPERS -->\n${paperList}\n<!-- END_PAPERS -->`
            );

            fs.writeFileSync('README.md', readme);

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update dashboard" && git push)
