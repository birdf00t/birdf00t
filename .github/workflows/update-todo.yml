              // 라벨에 없으면 연결된 GitHub Projects 보드의 모든 선택(SingleSelect) 필드에서 상태 조회
              if (!status && issue.node_id) {
                try {
                  const nodeRes = await github.graphql(`
                    query($id: ID!) {
                      node(id: $id) {
                        ... on Issue {
                          projectItems(first: 5) {
                            nodes {
                              fieldValues(first: 10) {
                                nodes {
                                  ... on ProjectV2ItemFieldSingleSelectValue {
                                    name
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `, { id: issue.node_id });

                  const items = nodeRes.node?.projectItems?.nodes || [];
                  for (const item of items) {
                    const fields = item.fieldValues?.nodes || [];
                    for (const f of fields) {
                      const pStatus = (f?.name || '').toLowerCase();
                      if (!pStatus) continue;

                      if (pStatus.includes('review') || pStatus.includes('done') || pStatus.includes('완료')) {
                        status = 'excluded';
                        break;
                      }
                      if (pStatus.includes('in progress') || pStatus.includes('inprogress') || pStatus.includes('진행')) {
                        status = 'in progress';
                        break;
                      }
                      if (pStatus.includes('todo') || pStatus.includes('to do') || pStatus.includes('할 일')) {
                        status = 'todo';
                        break;
                      }
                      if (pStatus.includes('backlog') || pStatus.includes('백로그')) {
                        status = 'backlog';
                        break;
                      }
                    }
                    if (status) break;
                  }
                } catch (e) {
                  console.log('Projects 조회 에러:', e.message);
                }
              }
