name: Update Overview Dashboard

on:
  schedule:
    # 매시간 정각마다 자동 실행 (UTC 기준)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch issues and papers, then update README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const username = context.repo.owner;

            // 1. 본인 계정의 모든 Public Open 이슈를 먼저 가져온 뒤 라벨 필터링 (검색 쿼리 누락 방지)
            const { data: openData } = await github.rest.search.issuesAndPullRequests({
              q: `user:${username} is:issue is:open is:public`,
              sort: 'updated',
              order: 'desc',
              per_page: 100
            });

            // Backlog, Todo, In progress 라벨만 필터링 (Review, Done 제외)
            const targetLabels = ['in progress', 'todo', 'backlog'];
            const filteredTodos = openData.items.filter(issue => {
              const names = issue.labels.map(l => l.name.toLowerCase().trim());
              const hasTarget = names.some(n => targetLabels.includes(n));
              const hasExcluded = names.includes('review') || names.includes('done');
              return hasTarget && !hasExcluded;
            });

            const getPriority = (issue) => {
              const names = issue.labels.map(l => l.name.toLowerCase().trim());
              if (names.includes('in progress')) return 1;
              if (names.includes('todo')) return 2;
              return 3;
            };

            let todoList = '';
            if (filteredTodos.length === 0) {
              todoList = '- 현재 할 일이 없습니다 🎉';
            } else {
              const sorted = filteredTodos.sort((a, b) => getPriority(a) - getPriority(b));
              todoList = sorted.map(issue => {
                const repoName = issue.repository_url.split('/').pop();
                const labelNames = issue.labels.map(l => l.name.toLowerCase().trim());

                let statusBadge = '📦 `[Backlog]`';
                if (labelNames.includes('in progress')) statusBadge = '🚧 `[In Progress]`';
                else if (labelNames.includes('todo')) statusBadge = '📝 `[To-Do]`';

                return `- [ ] ${statusBadge} **[${repoName}]** [${issue.title}](${issue.html_url})`;
              }).join('\n');
            }

            // 2. 공부한 논문 검색 (paper 라벨이 붙은 Open + Closed 이슈)
            const { data: paperData } = await github.rest.search.issuesAndPullRequests({
              q: `user:${username} is:issue is:public label:paper`,
              sort: 'updated',
              order: 'desc',
              per_page: 10
            });

            let paperList = '';
            if (paperData.items.length === 0) {
              paperList = '- 아직 등록된 논문 기록이 없습니다 📚';
            } else {
              const sortedPapers = paperData.items.sort((a, b) => {
                if (a.state === b.state) return 0;
                return a.state === 'open' ? -1 : 1;
              });

              paperList = sortedPapers.map(issue => {
                const isDone = issue.state === 'closed';
                const check = isDone ? '[x]' : '[ ]';
                const badge = isDone ? '✅ `[Done]`' : '📖 `[Reading]`';
                return `- ${check} ${badge} [${issue.title}](${issue.html_url})`;
              }).join('\n');
            }

            // 3. README.md 업데이트
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!-- START_TODO_ISSUES -->[\s\S]*<!-- END_TODO_ISSUES -->/,
              `<!-- START_TODO_ISSUES -->\n${todoList}\n<!-- END_TODO_ISSUES -->`
            );
            readme = readme.replace(
              /<!-- START_PAPERS -->[\s\S]*<!-- END_PAPERS -->/,
              `<!-- START_PAPERS -->\n${paperList}\n<!-- END_PAPERS -->`
            );

            fs.writeFileSync('README.md', readme);

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update tasks and paper reading log" && git push)
